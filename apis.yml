name: Marinus Pharmaceuticals
description: >-
  Marinus Pharmaceuticals is a pharmaceutical company known for developing ganaxolone
  (brand name ZTALMY), a neuroactive steroid and GABA-A receptor modulator approved for the
  treatment of seizures associated with CDKL5 deficiency disorder (CDD). The company operated
  in the rare-disease and epilepsy space of the life-sciences industry. As of 2026 its
  corporate domain (marinuspharma.com) redirects to Immedica Pharma (immedicaus.com),
  reflecting the acquisition of Marinus and its ganaxolone franchise. Marinus was surfaced in
  the API Evangelist network as a portfolio company of Canaan Partners. As a clinical- and
  commercial-stage pharmaceutical company it does not publish a public developer API, SDKs, or
  machine-readable API surface; this profile therefore captures corporate identity and domain
  security signals only.
